name: Update revised site styling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-revised-site.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update eyebrow color
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('idaho_families_work_revised.html')
          s = p.read_text(encoding='utf-8')
          old = '''.eyebrow{\n  font-family:"IBM Plex Mono",monospace;\n  font-size:12px;\n  letter-spacing:.16em;\n  text-transform:uppercase;\n  color:var(--green);\n}'''
          new = '''.eyebrow{\n  color:var(--gold)!important;\n  font-family:"IBM Plex Mono",monospace;\n  font-size:12px;\n  letter-spacing:.16em;\n  text-transform:uppercase;\n  color:var(--gold);\n}'''
          if old not in s:
              raise SystemExit('Expected eyebrow style block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add idaho_families_work_revised.html
          git diff --cached --quiet && exit 0
          git commit -m "Make eyebrow text gold throughout revised site"
          git push
