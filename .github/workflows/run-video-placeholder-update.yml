name: Run video placeholder update

"on":
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-video-placeholder-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update page
        run: python3 .github/scripts/update-video-placeholder.py
      - name: Commit change
        run: |
          git config user.name "mwalsh1988"
          git config user.email "137976980+mwalsh1988@users.noreply.github.com"
          git add idaho_families_work_revised.html
          git commit -m "Add image placeholder to video section"
          git push
