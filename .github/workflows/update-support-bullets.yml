name: Update Support bullets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Support What It Looks Like bullets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('idaho_families_work_revised.html')
          html = path.read_text(encoding='utf-8')

          support_start = html.index('<div class="pillar-header"><h3>Support</h3>')
          support_end = html.index('</article>', support_start)
          block = html[support_start:support_end]

          replacement = '''<span class="pillar-label">What It Looks Like</span>
            <ul>
              <li>Train managers to respond consistently to family-related conflicts.</li>
              <li>Give supervisors clear options for handling unexpected care disruptions.</li>
              <li>Encourage employees to raise challenges early, before they become attendance problems.</li>
              <li>Make sure employees can use available family-friendly policies without stigma or unnecessary friction.</li>
            </ul>'''

          pattern = r'<span class="pillar-label">What It Looks Like</span>\s*<ul>.*?</ul>'
          updated, count = re.subn(pattern, replacement, block, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Support What It Looks Like list not found')

          html = html[:support_start] + updated + html[support_end:]
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit updated page and remove one-time workflow
        run: |
          git config user.name "mwalsh1988"
          git config user.email "137976980+mwalsh1988@users.noreply.github.com"
          rm .github/workflows/update-support-bullets.yml
          git add idaho_families_work_revised.html .github/workflows/update-support-bullets.yml
          git commit -m "Update Support What It Looks Like bullets"
          git push
