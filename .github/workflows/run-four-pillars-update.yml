name: Run Four Pillars update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update page
        run: python .github/scripts/update_four_pillars.py
      - name: Commit changes
        run: |
          git config user.name "mwalsh1988"
          git config user.email "137976980+mwalsh1988@users.noreply.github.com"
          rm .github/scripts/update_four_pillars.py
          rm .github/workflows/run-four-pillars-update.yml
          git add idaho_families_work_revised.html .github/scripts/update_four_pillars.py .github/workflows/run-four-pillars-update.yml
          git commit -m "Expand Four Pillars into full-width guidance panels"
          git push
