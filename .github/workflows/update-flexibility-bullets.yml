name: Update Flexibility bullet list

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert Flexibility examples to bullets
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('idaho_families_work_revised.html')
          html = path.read_text(encoding='utf-8')

          css_old = '.pillar-detail p{font-size:16px;color:var(--body)}'
          css_new = '''.pillar-detail p{font-size:16px;color:var(--body)}
.pillar-bullets{
  margin:0;padding-left:20px;color:var(--body);font-size:16px;line-height:1.5
}
.pillar-bullets li+li{margin-top:7px}'''
          if css_old not in html:
              raise SystemExit('Pillar paragraph CSS anchor not found')
          html = html.replace(css_old, css_new, 1)

          old = '''            <span class="pillar-label">What It Looks Like</span>
            <p>Flexible start and end times when possible.</p>
            <p>Shift swapping with clear guidelines.</p>
            <p>Remote or hybrid options for eligible roles.</p>
            <p>Seasonal flexibility during school breaks or infant transitions.</p>'''

          new = '''            <span class="pillar-label">What It Looks Like</span>
            <ul class="pillar-bullets">
              <li>Flexible start and end times when possible.</li>
              <li>Shift swapping with clear guidelines.</li>
              <li>Remote or hybrid options for eligible roles.</li>
              <li>Seasonal flexibility during school breaks or infant transitions.</li>
            </ul>'''

          if old not in html:
              raise SystemExit('Flexibility What It Looks Like block not found')
          html = html.replace(old, new, 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit updated page and remove one-time workflow
        run: |
          git config user.name "mwalsh1988"
          git config user.email "137976980+mwalsh1988@users.noreply.github.com"
          rm .github/workflows/update-flexibility-bullets.yml
          git add idaho_families_work_revised.html .github/workflows/update-flexibility-bullets.yml
          git commit -m "Format Flexibility examples as bullet list"
          git push
