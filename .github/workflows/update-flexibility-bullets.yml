name: Update Flexibility bullet list

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert Flexibility examples to bullets
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('idaho_families_work_revised.html')
          html = path.read_text(encoding='utf-8')
          old = '            <span class="pillar-label">What It Looks Like</span>\n            <p>Flexible start and end times when possible.</p>\n            <p>Shift swapping with clear guidelines.</p>\n            <p>Remote or hybrid options for eligible roles.</p>\n            <p>Seasonal flexibility during school breaks or infant transitions.</p>'
          new = '            <span class="pillar-label">What It Looks Like</span>\n            <ul>\n              <li>Flexible start and end times when possible.</li>\n              <li>Shift swapping with clear guidelines.</li>\n              <li>Remote or hybrid options for eligible roles.</li>\n              <li>Seasonal flexibility during school breaks or infant transitions.</li>\n            </ul>'
          if old not in html:
              raise SystemExit('Flexibility What It Looks Like block not found')
          html = html.replace(old, new, 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit updated page and remove one-time workflow
        run: |
          git config user.name "mwalsh1988"
          git config user.email "137976980+mwalsh1988@users.noreply.github.com"
          rm .github/workflows/update-flexibility-bullets.yml
          git add idaho_families_work_revised.html .github/workflows/update-flexibility-bullets.yml
          git commit -m "Format Flexibility examples as bullet list"
          git push
