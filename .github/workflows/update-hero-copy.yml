name: Update hero copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-hero-copy.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update hero section
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('idaho_families_work_revised.html')
          s = p.read_text()
          old = '''      <p>Most Idaho employers do not have a child care line item. The cost still shows up in turnover, absences and shifts you cannot cover. Idaho Families Work helps employers reduce that friction — starting with practical no-cost and low-cost changes.</p>
      <div class="hero-actions">
        <a class="btn btn-gold" href="#business">See the business case</a>
        <a class="btn btn-outline" href="#contact">Find your starting point</a>
      </div>
      <span class="powered">Powered by Idaho AEYC</span>'''
          new = '''      <p>Family-friendly workplaces improve reliability, retention and performance. Enhance your workforce stability strategy today with the help of Idaho Families Work.</p>
      <div class="hero-actions">
        <a class="btn btn-gold" href="#first-steps">The Four Pillars</a>
      </div>'''
          if old not in s:
              raise SystemExit('Expected hero block not found; no changes made.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add idaho_families_work_revised.html
          git commit -m "Update hero copy and CTA"
          git push
