name: Use interview placeholder image

"on":
  push:
    branches:
      - main
    paths:
      - '.github/workflows/use-interview-placeholder.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update video placeholder image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('idaho_families_work_revised.html')
          html = path.read_text(encoding='utf-8')
          old = 'url("./Modern Workplace Rendering.png") center center / cover no-repeat;'
          new = 'url("./assets/images/interview-candidate-placeholder.jpg") center center / cover no-repeat;'
          if old not in html:
              raise SystemExit('Current video placeholder image reference not found')
          html = html.replace(old, new, 1)
          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit page update and remove workflow
        run: |
          git config user.name "mwalsh1988"
          git config user.email "137976980+mwalsh1988@users.noreply.github.com"
          rm .github/workflows/use-interview-placeholder.yml
          git add idaho_families_work_revised.html .github/workflows/use-interview-placeholder.yml
          git commit -m "Use interview image for video placeholder"
          git push
