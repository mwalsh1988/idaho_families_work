name: Refine Idaho impact design

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refine Idaho impact section
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('idaho_families_work_revised.html')
          html = path.read_text(encoding='utf-8')
          css_start = html.index('.impact-strip{')
          css_end = html.index('section{padding:86px 0}', css_start)
          new_css = '.impact-strip{\n  background:var(--blue-dark);color:#fff;padding:64px 0 60px;\n  border-bottom:1px solid rgba(255,255,255,.12)\n}\n.impact-strip-inner{\n  max-width:920px;margin:0 auto;text-align:center;\n  display:flex;flex-direction:column;align-items:center\n}\n.impact-strip-inner:before{\n  content:"";width:54px;height:3px;border-radius:2px;background:var(--gold);margin-bottom:24px\n}\n.impact-number{\n  font-family:"Soiren",Georgia,"Times New Roman",serif;\n  font-size:clamp(94px,14vw,164px);line-height:.82;letter-spacing:-.055em;color:#fff\n}\n.impact-copy{\n  margin-top:26px;font-size:clamp(21px,2.2vw,28px);line-height:1.3;\n  color:#dce7f5;max-width:34ch\n}\n.impact-source{\n  display:block;margin-top:16px;font-family:"IBM Plex Mono",monospace;\n  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9fb4d1\n}\n@media(max-width:700px){\n  .impact-strip{padding:50px 0 48px}\n  .impact-strip-inner:before{margin-bottom:20px}\n  .impact-copy{margin-top:22px}\n}\n\n'
          html = html[:css_start] + new_css + html[css_end:]
          section_start = html.index('<section class="impact-strip"')
          section_end = html.index('<section class="roi"', section_start)
          new_section = '<section class="impact-strip" aria-label="Idaho economic impact of child care challenges">\n  <div class="container">\n    <div class="impact-strip-inner">\n      <div class="impact-number">$688M</div>\n      <p class="impact-copy">Lost from Idaho\'s economy each year because families cannot access reliable child care.</p>\n      <span class="impact-source">ReadyNation · 2026</span>\n    </div>\n  </div>\n</section>\n\n'
          html = html[:section_start] + new_section + html[section_end:]
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit page update and remove workflow
        run: |
          git config user.name "mwalsh1988"
          git config user.email "137976980+mwalsh1988@users.noreply.github.com"
          rm .github/workflows/refine-idaho-impact.yml
          git add idaho_families_work_revised.html .github/workflows/refine-idaho-impact.yml
          git commit -m "Refine Idaho economic impact design"
          git push
